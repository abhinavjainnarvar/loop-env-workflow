<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loopdeck</title>
<style>
  :root{
    --ground:#0b0e14; --panel:#121722; --panel2:#1a2130; --line:#283041; --line-soft:#1d2533;
    --ink:#e9edf5; --muted:#8c95a8; --faint:#5a6378;
    --amber:#f0a830; --amber-dim:#332912; --amber-line:#5e4a1d;
    --blue:#5b93f5;  --blue-dim:#152339;  --blue-line:#2b456f;
    --green:#46b85f; --green-dim:#14301d; --green-line:#235a36;
    --violet:#9a7bf0;--violet-dim:#231d3a;--violet-line:#3f3168;
    --red:#ef5d52;   --red-dim:#371a18;   --red-line:#6e2d29;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);background:#0e1420;position:sticky;top:0;z-index:5}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:.24em;color:var(--amber);font-size:12px}
  .live{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;display:flex;gap:14px;align-items:center}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  .dot.on{background:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
  .dot.off{background:var(--faint)}
  main{display:grid;grid-template-columns:1fr 300px;gap:0;min-height:calc(100vh - 49px)}
  .cols{display:flex;gap:0;align-items:flex-start;overflow-x:auto;border-right:1px solid var(--line)}
  .col{flex:1;min-width:250px;border-right:1px solid var(--line-soft);padding:13px 12px;align-self:stretch}
  .col:last-child{border-right:0}
  .col-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;gap:7px}
  .col-h .ct{margin-left:auto;color:var(--faint)}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:10px;cursor:pointer}
  .card:hover{border-color:#33405a}
  .card .id{font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:6px}
  .card .ti{font-size:13.5px;font-weight:600;line-height:1.35;margin:7px 0 2px;color:var(--ink)}
  .card .nx{font-size:12px;margin:4px 0 9px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .colempty{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px dashed var(--line);border-radius:9px;padding:14px;text-align:center}
  .meta{display:flex;flex-wrap:wrap;gap:5px}
  .pill{font-family:var(--mono);font-size:10px;padding:2.5px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted);
    white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis} /* a long state must ellipsize, never escape the card */
  .pill.amber{color:var(--amber);border-color:var(--amber-line);background:var(--amber-dim)}
  .pill.blue{color:var(--blue);border-color:var(--blue-line);background:var(--blue-dim)}
  .pill.green{color:var(--green);border-color:var(--green-line);background:var(--green-dim)}
  .pill.violet{color:var(--violet);border-color:var(--violet-line);background:var(--violet-dim)}
  .pill.red{color:var(--red);border-color:var(--red-line);background:var(--red-dim)}
  .rail{background:#0e1420;padding:15px;display:flex;flex-direction:column;gap:14px}
  .rail h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0}
  .box{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--panel)}
  .box.hot{border-color:var(--blue-line);background:var(--blue-dim)}
  .box .k{font-family:var(--mono);font-size:11px;color:var(--blue)}
  .box .v{font-size:13px;margin-top:4px}
  .logline{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:2px 0;border-bottom:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* drawer */
  #drawer{position:fixed;inset:0 0 0 auto;width:min(760px,92vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .18s ease;z-index:10;display:flex;flex-direction:column}
  #drawer.open{transform:none}
  #drawer .dh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  #drawer .dh b{font-family:var(--mono);color:var(--amber)}
  #drawer .dh button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
  .tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;overflow-x:auto}
  .tabs span{padding:9px 11px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs span.on{color:var(--ink);border-bottom-color:var(--amber)}
  #filebody{flex:1;overflow:auto;padding:16px 20px}
  #filebody pre.raw{margin:0;font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#c7cede}
  /* rendered markdown */
  .mdview{max-width:72ch;font-size:13.5px;line-height:1.65;color:#c7cede}
  .mdview h1{font-size:17px;color:var(--ink);margin:4px 0 12px;line-height:1.35;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .mdview h2{font-size:14px;color:var(--amber);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:22px 0 8px}
  .mdview h3{font-size:13.5px;color:var(--ink);margin:16px 0 6px}
  .mdview p{margin:0 0 10px}
  .mdview ul,.mdview ol{margin:0 0 10px;padding-left:22px}
  .mdview li{margin:3px 0}
  .mdview code{font-family:var(--mono);font-size:11.5px;background:#0e1420;border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;color:#9fc1ff}
  .mdview pre{background:#0c111a;border:1px solid var(--line);border-radius:8px;padding:11px 13px;overflow-x:auto;margin:0 0 10px}
  .mdview pre code{background:none;border:0;padding:0;color:#c7cede;font-size:11.5px;line-height:1.5}
  .mdview b,.mdview strong{color:var(--ink)}
  .mdview a{color:var(--amber);text-decoration:none}
  .mdview a:hover{text-decoration:underline}
  .mdview blockquote{margin:0 0 10px;padding:6px 12px;border-left:3px solid var(--violet-line);color:var(--muted)}
  .mdview hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .mdview table{border-collapse:collapse;margin:0 0 12px;font-size:12.5px}
  .mdview th,.mdview td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .mdview th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#0e1420}
  .rawtoggle{margin-left:auto;align-self:center;font-family:var(--mono);font-size:10px;color:var(--faint);cursor:pointer;padding:4px 9px;border:1px solid var(--line);border-radius:5px}
  .rawtoggle.on{color:var(--amber);border-color:var(--amber-line)}
  /* dev-cycle timeline */
  .ev{position:relative;padding:0 0 18px 22px;border-left:1px solid var(--line);margin-left:6px}
  .ev:last-child{border-left-color:transparent}
  .ev::before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
  .ev.ok::before{background:var(--green);border-color:var(--green-line)}
  .ev.warn::before{background:var(--amber);border-color:var(--amber-line)}
  .ev.bad::before{background:var(--red);border-color:var(--red-line)}
  .ev .et{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .ev .ed{font-size:13px;margin-top:3px;line-height:1.5}
  .ev .er{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px}
  /* per-ticket chat */
  .chat{display:flex;flex-direction:column;gap:10px;max-width:64ch}
  .msg{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.55;background:var(--panel2)}
  .msg.you{background:var(--amber-dim);border-color:var(--amber-line);align-self:flex-end;max-width:85%}
  .msg.loop{align-self:flex-start;max-width:85%}
  .msg .who{font-family:var(--mono);font-size:10px;color:var(--faint);margin-bottom:4px}
  .msg.you .who{color:var(--amber)}
  .chatin{display:flex;gap:9px;margin-top:14px;position:sticky;bottom:0;background:var(--panel);padding:8px 0}
  .chatin textarea{flex:1;background:#0e1420;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font:13px/1.5 inherit;min-height:40px;resize:vertical}
  .chathint{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:5px}
  .empty{color:var(--faint);font-family:var(--mono);font-size:12px;padding:30px;text-align:center}
  /* message-the-board modal */
  .btn{font-family:var(--mono);font-size:12px;padding:6px 13px;border-radius:7px;border:1px solid var(--amber-line);background:var(--amber);color:#1a1206;font-weight:600;cursor:pointer}
  .btn.ghost{background:none;color:var(--muted);border-color:var(--line)}
  #shade{position:fixed;inset:0;background:#0009;display:none;z-index:20}
  #shade.open{display:flex;align-items:flex-start;justify-content:center;padding-top:10vh}
  .modal{width:min(480px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 70px -20px #000}
  .modal h4{margin:0;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:8px;align-items:center}
  .modal h4 .mk{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .mb{padding:15px 16px}
  .mb label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin:11px 0 5px}
  .mb select,.mb input,.mb textarea{width:100%;background:#0e1420;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
  .mb textarea{font-family:inherit;min-height:60px;resize:vertical}
  .mrow{display:flex;gap:9px}.mrow>div:first-child{flex:0 0 140px}.mrow>div:last-child{flex:1}
  #mpreview{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:#0c111a;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:7px;padding:10px 12px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
  #mpreview b{color:var(--amber)}
  .mf{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
  .mf .note{font-size:11.5px;color:var(--faint);flex:1}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--green-dim);border:1px solid var(--green-line);color:var(--green);font-family:var(--mono);font-size:12px;border-radius:8px;padding:9px 16px;display:none;z-index:30}
</style>
</head>
<body>
<header>
  <span class="brand">LOOPDECK</span>
  <button class="btn ghost" onclick="openModal()">✉ message the board</button>
  <span id="hb" class="live"></span>
</header>
<main>
  <div class="cols" id="cols"><div class="empty">loading board…</div></div>
  <aside class="rail" id="rail"></aside>
</main>
<div id="drawer">
  <div class="dh"><b id="dkey"></b>
    <button onclick="openModal(document.getElementById('dkey').textContent)" style="margin-left:auto;background:none;border:1px solid var(--amber-line);color:var(--amber);border-radius:6px;padding:4px 10px;cursor:pointer">✉ message</button>
    <button onclick="closeDrawer()" style="margin-left:8px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer">close</button>
  </div>
  <div class="tabs" id="dtabs"></div>
  <div id="filebody"><pre></pre></div>
</div>

<div id="shade" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h4>Message the board <span class="mk">→ inbox.md</span></h4>
    <div class="mb">
      <div class="mrow">
        <div><label>Verb</label>
          <select id="mverb" oninput="mpreview()">
            <option>note</option><option>ask</option><option>approve</option><option>reject</option>
            <option>changes</option><option>hold</option><option>resume</option><option>retry</option>
            <option>priority</option><option>drop</option><option>ingest</option><option>recompute</option>
          </select>
        </div>
        <div><label>Ticket / key</label><input id="mkey" oninput="mpreview()" placeholder="SHOPZ-1234"></div>
      </div>
      <label>Message (optional)</label>
      <textarea id="mtext" oninput="mpreview()" placeholder="context for the loop…"></textarea>
      <div id="mpreview"></div>
    </div>
    <div class="mf">
      <span class="note">Appends one line via the locked helper; the loop's Monitor applies it.</span>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="msend" onclick="sendCommand()">Send to board</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// state string → semantic color (amber = needs the human; blue = machine; …)
function tone(state){
  const s = (state||"").toLowerCase();
  if (/^awaiting|needs-human|pr-comments|ask/.test(s)) return "amber";
  if (/building|dispatch|running|triage|pr-ci/.test(s)) return "blue";
  if (/pr-clean|done|merged/.test(s)) return "green";
  if (/held|parked|backlog|deferred/.test(s)) return "violet";
  if (/blocked|conflict|failing/.test(s)) return "red";
  return "";
}
async function refresh(){
  const d = await (await fetch("/api/board")).json();
  // columns
  const cols = document.getElementById("cols");
  cols.innerHTML = "";
  for (const g of d.groups){
    const col = document.createElement("div"); col.className = "col";
    col.innerHTML = `<div class="col-h">${esc(g.title)}<span class="ct">${g.rows.length}</span></div>`;
    for (const r of g.rows){
      const c = document.createElement("div"); c.className = "card";
      c.innerHTML = `
        <div class="id"><span>${esc(r.key)}</span><span>${r.prs.slice(0,4).map(esc).join(" ")}</span></div>
        <div class="ti">${esc(r.title || r.next || r.key)}</div>
        ${r.title && r.next ? `<div class="nx">${esc(r.next)}</div>` : ""}
        <div class="meta">${r.state ? `<span class="pill ${tone(r.state)}">${esc(r.state)}</span>` : ""}</div>`;
      c.onclick = () => openDrawer(r.key.split(" ")[0]);
      col.appendChild(c);
    }
    if (!g.rows.length) col.insertAdjacentHTML("beforeend", `<div class="colempty">empty</div>`);
    cols.appendChild(col);
  }
  if (!d.groups.length) cols.innerHTML = `<div class="empty">no groups found in board.md</div>`;
  // heartbeat header
  const st = d.state;
  document.getElementById("hb").innerHTML = st
    ? `<span><span class="dot on"></span>wake ${esc(String(st.wake ?? "?"))} · ${esc(st.step ?? "")}</span>`
    : `<span><span class="dot off"></span>no heartbeat (loop not running or pre-state.json)</span>`;
  // rail
  const rail = document.getElementById("rail");
  rail.innerHTML = `<h3>Live loop</h3>`;
  rail.innerHTML += st
    ? `<div class="box hot"><div class="k">RUNNING — wake ${esc(String(st.wake ?? "?"))}</div>
       <div class="v">${esc(st.step ?? "")}</div>
       <div class="v" style="color:var(--muted)">next → ${esc(st.next ?? "?")}</div>
       ${(st.workers||[]).map(w=>`<div class="v" style="font-family:var(--mono);font-size:11px;color:var(--blue)">⟳ ${esc(typeof w==="string"?w:JSON.stringify(w))}</div>`).join("")}</div>`
    : `<div class="box"><div class="v" style="color:var(--faint)">no state.json heartbeat</div></div>`;
  rail.innerHTML += `<h3>Lock</h3><div class="box"><pre style="margin:0;font:10.5px var(--mono);color:var(--muted);white-space:pre-wrap">${esc(d.lock ?? "board free (no loop.lock)")}</pre></div>`;
  rail.innerHTML += `<h3>Log tail</h3><div class="box">${(d.logTail||[]).map(l=>`<div class="logline" title="${esc(l)}">${esc(l)}</div>`).join("")}</div>`;
}
// ── tiny markdown renderer — LOSSLESS formatting of the verbatim files ──
// (rendering ≠ distillation: the content is exact, only presentation changes.
//  escape-first, then transform — so file content can never inject HTML.)
function md(src){
  const codes = [];
  let s = esc(src ?? "");
  s = s.replace(/```([\s\S]*?)```/g, (_, c) => { codes.push(c.replace(/^\n|\n$/g, "")); return `\uE000${codes.length - 1}\uE000`; });
  const inline = t => t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\s)_([^_]+)_(?=\s|[.,;:!?)]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[([^\]]+)\]\([^)\s]*\)/g, "$1");
  const lines = s.split("\n"), out = [];
  let list = null, table = null;
  const flushList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const flushTable = () => { if (table) { out.push("</table>"); table = null; } };
  for (const raw of lines){
    const l = raw;
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h){ flushList(); flushTable(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*---+\s*$/.test(l)){ flushList(); flushTable(); out.push("<hr>"); continue; }
    if (/^\|/.test(l.trim())){
      flushList();
      const cells = l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;              // the |---| separator row
      if (!table){ table = true; out.push("<table>"); out.push(`<tr>${cells.map(c=>`<th>${inline(c)}</th>`).join("")}</tr>`); }
      else out.push(`<tr>${cells.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`);
      continue;
    }
    flushTable();
    const li = l.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if (li){
      const kind = /\d/.test(li[1]) ? "ol" : "ul";
      if (list !== kind){ flushList(); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline(li[2])}</li>`); continue;
    }
    flushList();
    if (/^&gt;\s?/.test(l.trim())){ out.push(`<blockquote>${inline(l.trim().replace(/^&gt;\s?/, ""))}</blockquote>`); continue; }
    if (l.trim() === ""){ continue; }
    out.push(`<p>${inline(l)}</p>`);
  }
  flushList(); flushTable();
  return out.join("\n").replace(/\uE000(\d+)\uE000/g, (_, i) => `<pre><code>${codes[+i]}</code></pre>`);
}

// drawer: the ticket's own files, verbatim — rendered (raw toggle available)
let dfiles = {}, rawMode = false, curFile = null;
// cycle.md rows are ` · `-separated ledger lines: ts · role · agent · scope · conclusion
function renderCycle(src){
  const evs = (src ?? "").split("\n").filter(l => l.trim() && !l.startsWith("#"));
  if (!evs.length) return `<div class="empty">no dev-cycle entries yet</div>`;
  return evs.map(l => {
    const parts = l.replace(/^[-*]\s*/, "").split("·").map(s => s.trim());
    const [ts, role, agent, scope, concl] = [parts[0], parts[1] ?? "", parts[2] ?? "", parts.slice(3, -1).join(" · "), parts.at(-1) ?? ""];
    const tone2 = /conclud|done|merged|green/i.test(concl) ? "ok" : /halt|block|fail|reject/i.test(concl) ? "bad" : /gate|parked|await|human/i.test(concl) ? "warn" : "";
    return `<div class="ev ${tone2}"><div class="et">${esc(ts)}</div><div class="ed">${esc(scope || concl)}</div><div class="er">${esc([role, agent, concl].filter(Boolean).join(" · "))}</div></div>`;
  }).join("");
}
// chat.md thread: `**you** ‹ts›` / `**loop** ‹ts›` turn headers, transcribed by the loop
function renderChat(src){
  const turns = [];
  let cur = null;
  for (const l of (src ?? "").split("\n")){
    const m = l.match(/^\*\*(you|loop)\*\*\s*‹([^›]*)›/);
    if (m){ cur = { who: m[1], ts: m[2], text: [] }; turns.push(cur); continue; }
    if (cur && l.trim()) cur.text.push(l);
  }
  const thread = turns.map(t =>
    `<div class="msg ${t.who}"><div class="who">${t.who === "you" ? "you" : "⟳ loop"} · ${esc(t.ts)}</div>${md(t.text.join("\n"))}</div>`).join("");
  return `<div class="chat">${thread || '<div class="empty">no messages yet — ask the loop about this ticket</div>'}</div>
    <div class="chatin"><textarea id="chattext" placeholder="ask about this ticket… (queues an 'ask ${esc(dkeySlug())}' command — the loop answers on its next wake)"></textarea>
    <button class="btn" onclick="sendAsk()">Ask</button></div>
    <div class="chathint">explicit ask verb via the inbox — never a gate; the loop transcribes Q&amp;A into chat.md</div>`;
}
function dkeySlug(){ return (document.getElementById("dkey").textContent || "").split(" ")[0]; }
async function sendAsk(){
  const t = document.getElementById("chattext");
  if (!t.value.trim()) return;
  const r = await fetch("/api/inbox", { method: "POST", body: JSON.stringify({ verb: "ask", key: dkeySlug(), text: t.value }) });
  if (!r.ok) return void alert("failed: " + await r.text());
  t.value = ""; t.placeholder = "queued — the loop answers on its next wake (this thread updates live)";
}
const VIRTUAL = { "⏱ dev cycle": "cycle.md", "💬 chat": "chat.md" };
function renderFile(){
  const body = document.getElementById("filebody");
  if (curFile === "⏱ dev cycle") return void (body.innerHTML = renderCycle(dfiles["cycle.md"]));
  if (curFile === "💬 chat")     return void (body.innerHTML = renderChat(dfiles["chat.md"]));
  const src = dfiles[curFile] ?? "(empty)";
  if (rawMode) { body.innerHTML = ""; const p = document.createElement("pre"); p.className = "raw"; p.textContent = src; body.appendChild(p); }
  else body.innerHTML = `<div class="mdview">${md(src)}</div>`;
}
function renderTabs(){
  const names = Object.keys(dfiles).filter(n => n !== "cycle.md"); // cycle renders via its tab
  const virt = [];
  if ("cycle.md" in dfiles) virt.push("⏱ dev cycle");
  virt.push("💬 chat"); // always offered — first ask creates the thread
  document.getElementById("dtabs").innerHTML =
    [...virt, ...names.filter(n => n !== "chat.md")].map(n=>`<span class="${n===curFile?"on":""}" onclick="pick('${esc(n)}')">${esc(n)}</span>`).join("") +
    `<span class="rawtoggle ${rawMode?"on":""}" onclick="rawMode=!rawMode;renderTabs();renderFile()">raw</span>`;
}
async function openDrawer(key){
  const r = await fetch("/api/ticket/" + encodeURIComponent(key));
  document.getElementById("dkey").textContent = key;
  if (!r.ok){ dfiles = {}; curFile = null; renderTabs(); document.getElementById("filebody").innerHTML = `<div class="empty">(no tickets/${esc(key)}/ folder)</div>`; }
  else {
    dfiles = (await r.json()).files;
    // lead with the human-facing files when present
    const names = Object.keys(dfiles);
    const pref = ["spec.md","plan.md","review.md","decisions.md","journal.md","cycle.md"];
    curFile = pref.find(p=>names.includes(p)) ?? names[0] ?? null;
    renderTabs(); renderFile();
  }
  document.getElementById("drawer").classList.add("open");
}
function pick(name){ curFile = name; renderTabs(); renderFile(); }
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
// message-the-board modal: explicit verb only — a gate is never parsed from prose
function openModal(key){
  document.getElementById("mkey").value = (key || "").split(" ")[0];
  document.getElementById("mtext").value = "";
  mpreview();
  document.getElementById("shade").classList.add("open");
}
function closeModal(){ document.getElementById("shade").classList.remove("open"); }
function mline(){
  const v = document.getElementById("mverb").value, k = document.getElementById("mkey").value.trim(),
        t = document.getElementById("mtext").value.trim();
  return [v, k, t].filter(Boolean).join(" ");
}
function mpreview(){
  const el = document.getElementById("mpreview");
  el.innerHTML = `<b>${esc(document.getElementById("mverb").value)}</b> ${esc(mline().split(" ").slice(1).join(" "))}`;
}
async function sendCommand(){
  const k = document.getElementById("mkey").value.trim();
  if (!k) return void alert("a ticket/key is required");
  const btn = document.getElementById("msend"); btn.disabled = true;
  const r = await fetch("/api/inbox", { method: "POST",
    body: JSON.stringify({ verb: document.getElementById("mverb").value, key: k,
                           text: document.getElementById("mtext").value }) });
  btn.disabled = false;
  if (!r.ok) return void alert("failed: " + await r.text());
  closeModal();
  const t = document.getElementById("toast");
  t.textContent = "queued → " + (await r.json()).queued;
  t.style.display = "block";
  setTimeout(() => (t.style.display = "none"), 3500);
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
// live: any board-dir change → refetch board AND the open drawer (so a loop reply
// lands in the chat thread without reopening; typed-but-unsent input is preserved)
new EventSource("/events").onmessage = async () => {
  refresh();
  if (document.getElementById("drawer").classList.contains("open") && dkeySlug()){
    const draft = document.getElementById("chattext")?.value ?? "";
    const r = await fetch("/api/ticket/" + encodeURIComponent(dkeySlug()));
    if (r.ok){ dfiles = (await r.json()).files; renderTabs(); renderFile();
      const t = document.getElementById("chattext"); if (t && draft) t.value = draft; }
  }
};
refresh();
</script>
</body>
